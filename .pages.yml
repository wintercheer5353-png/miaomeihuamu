media:
  - name: work_images
    label: 作品图片
    input: assets/uploads/images
    output: /assets/uploads/images
    categories: [image]
  - name: work_videos
    label: 作品视频
    input: assets/uploads/videos
    output: /assets/uploads/videos
    categories: [video]

content:
  - name: gallery
    label: 官网作品管理
    type: file
    path: content/gallery.json
    format: json
    list: true
    fields:
      - name: title
        label: 展示标题
        type: string
        required: true
      - name: category
        label: 项目分类
        type: select
        options:
          values: [女士野生眉, 男士野生眉, 美瞳线, 唇部, 纹发际线, 其他]
      - name: image
        label: 图片（图片作品填写）
        type: image
        options:
          media: work_images
      - name: video
        label: 视频（视频作品填写）
        type: file
        options:
          media: work_videos
          extensions: [mp4, webm]
      - name: alt
        label: 图片说明（给搜索和无障碍使用）
        type: string
      - name: published
        label: 在官网展示
        type: boolean
        default: true
      - name: wide
        label: 宽版展示
        type: boolean
        default: false
